name: jobtrack

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobtrack}
      POSTGRES_USER: ${DB_USERNAME:-jobtrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobtrack_dev_password}
    ports:
      # Use port 5434 on host to avoid conflict with local PostgreSQL (5432) or other projects
      - "${DB_PORT:-5434}:5432"
    volumes:
      - jobtrack_postgres_data:/var/lib/postgresql/data
    networks:
      - jobtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobtrack_user} -d ${DB_NAME:-jobtrack}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtrack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jobtrack}
      DB_USERNAME: ${DB_USERNAME:-jobtrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-jobtrack_dev_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - jobtrack-network

  # ── Angular Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - jobtrack-network

# ── Dedicated Volumes ──────────────────────────────────────────────────────────
volumes:
  jobtrack_postgres_data:
    name: jobtrack_postgres_data

# ── Dedicated Network ──────────────────────────────────────────────────────────
networks:
  jobtrack-network:
    name: jobtrack-network
    driver: bridge
