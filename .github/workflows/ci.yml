name: JobTrack CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — Java Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test --no-transfer-progress
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          JWT_EXPIRATION: 86400000
          FRONTEND_URL: http://localhost:4200

  # ── Frontend Tests ───────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend — Angular Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run lint
        run: npm run lint -- --no-progress
        working-directory: frontend
        continue-on-error: true

      - name: Run tests (headless)
        run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: frontend

  # ── Docker Build Check ───────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Check
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-tests ]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t jobtrack-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t jobtrack-frontend:ci ./frontend
